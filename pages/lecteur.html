<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lecteur intégré Maktaba.">
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/navigation-hero.css">
    <link rel="stylesheet" href="../css/composants.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/theme-clair.css">
    <link rel="stylesheet" href="../css/pages-secondaires.css">
    <link rel="stylesheet" href="../css/dynamique.css">
    <link rel="stylesheet" href="../css/lecteur.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script src="https://kit.fontawesome.com/c665d6d536.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Lecture — Maktaba</title>
</head>
<body class="page-lecteur">

    <header class="entete-lecteur">
        <a href="livre.html" class="bouton-retour-lecteur" id="lien-retour-livre" aria-label="Retour à la fiche du livre">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="titre-lecteur" id="titre-lecteur">Chargement...</h1>
        <button class="bouton-theme bascule-theme" type="button" aria-label="Changer de thème">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <div class="conteneur-lecteur">

        <aside class="sommaire-lecteur" id="sommaire-lecteur">
            <h2>Sommaire</h2>
            <div id="liste-sommaire">
                <p class="message-vide-inline">Pas de sommaire disponible pour cet ouvrage.</p>
            </div>
        </aside>

        <main class="zone-lecture">
            <div class="barre-outils-lecteur">
                <button id="bouton-page-precedente" type="button" aria-label="Page précédente">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="indicateur-page">
                    <input type="number" id="champ-page-actuelle" min="1" value="1" aria-label="Numéro de page">
                    <span>/ <span id="nombre-total-pages">—</span></span>
                </div>
                <button id="bouton-page-suivante" type="button" aria-label="Page suivante">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

                <div class="separateur-outils"></div>

                <button id="bouton-zoom-moins" type="button" aria-label="Zoom arrière">
                    <i class="fa-solid fa-magnifying-glass-minus"></i>
                </button>
                <span id="pourcentage-zoom">100%</span>
                <button id="bouton-zoom-plus" type="button" aria-label="Zoom avant">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>

                <div class="separateur-outils"></div>

                <button id="bouton-mode-continu" type="button" aria-label="Basculer en défilement continu">
                    <i class="fa-solid fa-scroll"></i>
                </button>
                <button id="bouton-plein-ecran" type="button" aria-label="Plein écran">
                    <i class="fa-solid fa-expand"></i>
                </button>

                <button id="bouton-basculer-sommaire" type="button" class="bouton-basculer-sommaire-mobile" aria-label="Afficher/masquer le sommaire">
                    <i class="fa-solid fa-list"></i>
                </button>
                <button id="bouton-journal-technique" type="button" aria-label="Afficher le journal technique">
                    <i class="fa-solid fa-bug"></i>
                </button>
            </div>

            <div class="panneau-journal-technique" id="panneau-journal-technique" hidden>
                <div class="entete-journal-technique">
                    <strong>Journal technique</strong>
                    <button type="button" id="bouton-fermer-journal" aria-label="Fermer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="contenu-journal-technique"></div>
            </div>

            <div class="zone-canvas" id="zone-canvas">
                <div class="chargement-lecteur" id="chargement-lecteur">
                    <div class="icone-livre-anime">
                        <i class="fa-solid fa-book-open"></i>
                        <span class="page-tournante"></span>
                    </div>
                    <p class="texte-chargement" id="message-chargement-pdf">Chargement du document...</p>
                    <div class="barre-progression-conteneur barre-chargement-lecteur">
                        <div class="barre-progression-remplissage" id="barre-chargement-pdf" style="width: 0%;"></div>
                    </div>
                </div>
                <canvas id="canvas-pdf" hidden></canvas>
            </div>
        </main>

    </div>

<script src="../js/supabase-client.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lecteur.js"></script>
</body>
</html>
